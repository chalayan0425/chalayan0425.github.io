<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>回光療癒</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #23201d;
      --muted: #6b625b;
      --paper: #fffaf2;
      --line: rgba(35, 32, 29, 0.14);
      --amber: #c47732;
      --green: #536b53;
      --blue: #5f788f;
      --rose: #b36a6c;
      --shadow: 0 18px 45px rgba(52, 43, 35, 0.16);
      font-family: "Noto Serif TC", "Songti TC", "PingFang TC", serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 8%, rgba(196, 119, 50, 0.16), transparent 26rem),
        radial-gradient(circle at 86% 12%, rgba(95, 120, 143, 0.13), transparent 22rem),
        linear-gradient(135deg, #fff8ed 0%, #f7efe3 46%, #ecf0ea 100%);
    }

    body.ritual-lock {
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1480px, calc(100% - 36px));
      margin: 0 auto;
      padding: 26px 0 40px;
      opacity: 1;
      transition: opacity 900ms ease;
    }

    body:not(.is-started) .app {
      opacity: 0;
      pointer-events: none;
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: start center;
      min-height: 100dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: max(18px, env(safe-area-inset-top)) 28px max(28px, env(safe-area-inset-bottom));
      color: #fffaf2;
      background:
        linear-gradient(180deg, rgba(54, 40, 24, 0.18), rgba(34, 25, 17, 0.5)),
        url("intro-light.JPG") center / cover;
      transition: opacity 900ms ease, visibility 900ms ease;
    }

    .intro::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 56% 40%, rgba(255, 250, 242, 0.28), transparent 29rem),
        linear-gradient(90deg, rgba(50, 34, 17, 0.16), transparent 32%, transparent 68%, rgba(50, 34, 17, 0.18));
      pointer-events: none;
    }

    body.is-started .intro {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-inner {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: clamp(14px, 3dvh, 28px);
      width: min(520px, 100%);
      min-height: calc(100dvh - max(18px, env(safe-area-inset-top)) - max(28px, env(safe-area-inset-bottom)));
      padding: clamp(16px, 6dvh, 54px) 0 clamp(30px, 8dvh, 74px);
      text-align: center;
    }

    .breathing-card {
      position: relative;
      width: min(34dvh, 290px, 68vw);
      aspect-ratio: 0.72;
      min-width: 150px;
      max-height: 40dvh;
      border: 1px solid rgba(255, 250, 242, 0.42);
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.18), transparent 44%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.1) 0 2px, transparent 2px 13px),
        linear-gradient(135deg, rgba(124, 63, 54, 0.96), rgba(189, 123, 66, 0.92) 45%, rgba(83, 107, 83, 0.96));
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.32);
      animation: breatheCard 5.8s ease-in-out infinite;
    }

    .breathing-card::before,
    .breathing-card::after {
      content: "";
      position: absolute;
      inset: 15%;
      border: 1px solid rgba(255, 250, 242, 0.42);
      border-radius: 50%;
    }

    .breathing-card::after {
      inset: 31%;
      background: rgba(255, 250, 242, 0.08);
    }

    .intro-kicker {
      margin: 0;
      max-width: 12em;
      font-size: clamp(1.25rem, 3vw, 2rem);
      line-height: 1.7;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.48);
    }

    .intro-kicker span {
      display: block;
      margin-top: 8px;
      font-size: clamp(1.55rem, 4vw, 2.72rem);
      font-weight: 800;
    }

    .start-button,
    .reveal-close {
      min-height: 46px;
      border: 1px solid rgba(255, 250, 242, 0.5);
      border-radius: 999px;
      padding: 0 22px;
      color: #fffaf2;
      background: rgba(255, 250, 242, 0.13);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(18px);
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }

    .start-button {
      flex-shrink: 0;
      min-width: min(210px, 80vw);
      margin-bottom: max(10px, env(safe-area-inset-bottom));
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
      font-weight: 700;
      line-height: 1.35;
      white-space: normal;
    }

    .start-button:hover,
    .reveal-close:hover {
      transform: translateY(-2px);
      background: rgba(255, 250, 242, 0.2);
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.35rem, 4.8vw, 5rem);
      line-height: 0.95;
      letter-spacing: 0;
      font-weight: 800;
    }

    .subtitle {
      max-width: 760px;
      margin: 12px 0 0;
      color: var(--muted);
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: 1rem;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
    }

    .pill {
      min-height: 42px;
      border: 1px solid var(--line);
      background: rgba(255, 250, 242, 0.72);
      color: var(--ink);
      border-radius: 999px;
      padding: 0 16px;
      box-shadow: 0 10px 24px rgba(52, 43, 35, 0.08);
      backdrop-filter: blur(16px);
    }

    .action-button {
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .action-button:hover {
      transform: translateY(-1px);
      background: #ffffff;
      box-shadow: 0 14px 28px rgba(52, 43, 35, 0.12);
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 24px;
      align-items: start;
    }

    .deck {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
    }

    .card-button {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      perspective: 1200px;
      transform-origin: center;
      transition: transform 220ms ease, filter 220ms ease;
      isolation: isolate;
    }

    .card-button:hover {
      transform: translateY(-4px);
    }

    .card-button.is-drawing {
      z-index: 20;
      animation: drawFocus 980ms cubic-bezier(0.16, 0.84, 0.28, 1);
    }

    .card-button.is-drawing::after {
      content: "";
      position: absolute;
      inset: -18px;
      z-index: -1;
      border-radius: 28px;
      background:
        radial-gradient(circle, rgba(255, 239, 184, 0.62), rgba(255, 239, 184, 0.18) 42%, transparent 70%);
      animation: drawGlow 980ms ease-out;
    }

    .card-button.is-flipped {
      filter: saturate(1.04) contrast(1.02);
    }

    .card-button:focus-visible {
      outline: 3px solid rgba(196, 119, 50, 0.8);
      outline-offset: 5px;
      border-radius: 18px;
    }

    .card {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      transform-style: preserve-3d;
      transition: transform 720ms cubic-bezier(0.18, 0.82, 0.24, 1);
      box-shadow: 0 16px 34px rgba(52, 43, 35, 0.14);
    }

    .card-button.is-flipped .card {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 16px;
      backface-visibility: hidden;
      border: 1px solid rgba(255, 255, 255, 0.58);
    }

    .back {
      display: grid;
      place-items: center;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.22), transparent 48%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.11) 0 2px, transparent 2px 12px),
        linear-gradient(135deg, #7c3f36 0%, #bd7b42 42%, #536b53 100%);
    }

    .back::before {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(255, 250, 242, 0.42);
      border-radius: 50%;
    }

    .back::after {
      content: "";
      position: absolute;
      inset: 26%;
      border-radius: 50%;
      background: rgba(255, 250, 242, 0.14);
      box-shadow: 0 0 42px rgba(255, 239, 184, 0.28);
    }

    .light-symbol {
      position: relative;
      z-index: 1;
      width: 62%;
      aspect-ratio: 1;
      filter: drop-shadow(0 0 18px rgba(255, 244, 204, 0.58));
    }

    .light-symbol::before,
    .light-symbol::after {
      content: "";
      position: absolute;
    }

    .light-1::before {
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 252, 225, 1) 0 9%, rgba(255, 225, 142, 0.7) 10% 18%, transparent 19%),
        repeating-conic-gradient(from 0deg, rgba(255, 250, 214, 0.9) 0 4deg, transparent 5deg 18deg);
    }

    .light-1::after {
      inset: 31%;
      border-radius: 50%;
      background: rgba(255, 250, 242, 0.94);
      box-shadow: 0 0 26px rgba(255, 238, 183, 0.88);
    }

    .light-2::before {
      inset: 9% 7%;
      border: 2px solid rgba(255, 250, 214, 0.72);
      border-radius: 50%;
      box-shadow:
        0 0 0 18px rgba(255, 238, 183, 0.12),
        inset 0 0 28px rgba(255, 236, 178, 0.36);
    }

    .light-2::after {
      inset: 24%;
      border: 1px solid rgba(255, 250, 242, 0.74);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 250, 242, 0.96), rgba(255, 224, 139, 0.22) 62%, transparent 64%);
    }

    .light-3::before {
      inset: 2% 42% 2% 42%;
      border-radius: 999px;
      background: linear-gradient(180deg, transparent, rgba(255, 250, 214, 0.92) 18%, rgba(255, 250, 214, 0.98) 52%, rgba(255, 224, 139, 0.66) 82%, transparent);
      box-shadow: 0 0 30px rgba(255, 238, 183, 0.72);
      transform: rotate(12deg);
    }

    .light-3::after {
      inset: 39% 10%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255, 250, 214, 0.82), transparent);
      transform: rotate(12deg);
    }

    .light-4::before {
      inset: 16%;
      border-radius: 0;
      background:
        linear-gradient(90deg, transparent 46%, rgba(255, 250, 214, 0.88) 47% 53%, transparent 54%),
        linear-gradient(0deg, transparent 46%, rgba(255, 250, 214, 0.88) 47% 53%, transparent 54%);
      box-shadow: 0 0 24px rgba(255, 238, 183, 0.68);
      transform: rotate(45deg);
    }

    .light-4::after {
      inset: 33%;
      border-radius: 24%;
      background: rgba(255, 250, 242, 0.92);
      transform: rotate(45deg);
    }

    .light-5::before {
      inset: 14% 10% 12% 10%;
      border-radius: 60% 40% 62% 38% / 48% 60% 40% 52%;
      background:
        radial-gradient(circle at 38% 46%, rgba(255, 250, 242, 0.98) 0 12%, transparent 13%),
        linear-gradient(125deg, transparent 0 22%, rgba(255, 250, 214, 0.92) 23% 43%, rgba(255, 224, 139, 0.48) 44% 64%, transparent 65%);
      box-shadow: 0 0 34px rgba(255, 238, 183, 0.52);
    }

    .light-5::after {
      inset: 26% 2% 45% 38%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 250, 214, 0.96), transparent);
      transform: rotate(-10deg);
    }

    .light-6::before {
      inset: 18%;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 250, 242, 0.98) 0 11%, transparent 12%),
        repeating-radial-gradient(circle, transparent 0 12px, rgba(255, 250, 214, 0.48) 13px 15px, transparent 16px 25px);
    }

    .light-6::after {
      inset: 6%;
      border: 1px solid rgba(255, 250, 214, 0.34);
      border-radius: 50%;
      box-shadow: inset 0 0 28px rgba(255, 238, 183, 0.28);
    }

    .light-7::before {
      inset: 20% 6%;
      border-radius: 999px;
      background:
        radial-gradient(circle at 22% 50%, rgba(255, 250, 242, 0.98) 0 9%, transparent 10%),
        linear-gradient(90deg, rgba(255, 250, 214, 0.98), rgba(255, 224, 139, 0.42) 45%, transparent 80%);
      transform: rotate(-24deg);
      box-shadow: 0 0 28px rgba(255, 238, 183, 0.58);
    }

    .light-7::after {
      inset: 12% 4% 58% 52%;
      border-top: 2px solid rgba(255, 250, 214, 0.72);
      border-radius: 50%;
      transform: rotate(-24deg);
    }

    .light-8::before {
      inset: 14%;
      background:
        linear-gradient(90deg, rgba(255, 250, 214, 0.62) 0 2px, transparent 3px 28%, rgba(255, 250, 214, 0.84) 29% 31%, transparent 32% 66%, rgba(255, 250, 214, 0.52) 67% 69%, transparent 70%),
        linear-gradient(0deg, rgba(255, 250, 214, 0.5) 0 2px, transparent 3px 30%, rgba(255, 250, 214, 0.76) 31% 34%, transparent 35% 70%, rgba(255, 250, 214, 0.5) 71% 73%, transparent 74%);
      border-radius: 8px;
      box-shadow: 0 0 28px rgba(255, 238, 183, 0.5);
    }

    .light-8::after {
      inset: 28%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 250, 242, 0.96), transparent 68%);
    }

    .light-9::before {
      inset: 8%;
      border-radius: 18% 82% 21% 79% / 72% 22% 78% 28%;
      background:
        radial-gradient(circle at 52% 52%, rgba(255, 250, 242, 0.96) 0 10%, transparent 11%),
        conic-gradient(from 142deg, transparent, rgba(255, 250, 214, 0.9) 18%, transparent 30%, rgba(255, 224, 139, 0.72) 52%, transparent 70%, rgba(255, 250, 214, 0.72), transparent);
      box-shadow: 0 0 32px rgba(255, 238, 183, 0.58);
      transform: rotate(-18deg);
    }

    .light-9::after {
      inset: 39% 14%;
      border-top: 1px solid rgba(255, 250, 214, 0.7);
      transform: rotate(32deg);
    }

    .light-10::before {
      inset: 8%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 250, 242, 1) 0 8%, transparent 9%),
        radial-gradient(circle at 24% 28%, rgba(255, 250, 242, 0.86) 0 4%, transparent 5%),
        radial-gradient(circle at 74% 30%, rgba(255, 236, 178, 0.82) 0 3.6%, transparent 4.6%),
        radial-gradient(circle at 68% 76%, rgba(255, 250, 214, 0.82) 0 4%, transparent 5%),
        linear-gradient(32deg, transparent 0 45%, rgba(255, 250, 214, 0.5) 46% 48%, transparent 49%),
        linear-gradient(138deg, transparent 0 44%, rgba(255, 250, 214, 0.45) 45% 47%, transparent 48%);
    }

    .light-10::after {
      inset: 20%;
      border: 1px dashed rgba(255, 250, 214, 0.48);
      border-radius: 50%;
    }

    .front {
      transform: rotateY(180deg);
      background: #1f1c19;
    }

    .front::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 48%;
      background: linear-gradient(180deg, transparent 0%, rgba(20, 17, 15, 0.2) 38%, rgba(20, 17, 15, 0.74) 100%);
      pointer-events: none;
    }

    .front img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .note {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      padding: 34px 13px 12px;
      color: #fffaf2;
      text-align: left;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
    }

    .note b {
      display: block;
      margin-bottom: 3px;
      font-size: clamp(0.78rem, 0.9vw, 0.98rem);
      line-height: 1.25;
    }

    .note span {
      display: block;
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: clamp(0.66rem, 0.78vw, 0.82rem);
      font-weight: 600;
      line-height: 1.5;
      opacity: 0.92;
    }

    .reading {
      position: sticky;
      top: 22px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 250, 242, 0.74);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .reading-label {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(83, 107, 83, 0.12);
      color: var(--green);
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .reading h2 {
      margin: 16px 0 12px;
      font-size: 1.7rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .zh,
    .en {
      margin: 0;
      line-height: 1.9;
    }

    .zh {
      font-size: 1.13rem;
      font-weight: 700;
    }

    .en {
      margin-top: 18px;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.98rem;
      font-style: italic;
    }

    .hint {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .reveal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #fffaf2;
      background: #17120d;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 900ms ease, visibility 900ms ease;
    }

    .reveal.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .reveal-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      filter: saturate(1.04) contrast(1.02) drop-shadow(0 26px 70px rgba(0, 0, 0, 0.34));
      transform: scale(1);
    }

    .reveal-backdrop {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      object-fit: cover;
      opacity: 0;
      filter: blur(24px) saturate(1.08) brightness(0.62);
      transform: scale(1.08);
    }

    .reveal.is-open .reveal-image {
      animation: revealPhoto 11s ease-out forwards;
    }

    .reveal.is-open .reveal-backdrop {
      animation: revealBackdrop 11s ease-out forwards;
    }

    .reveal::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 42%, transparent 0%, rgba(18, 15, 13, 0.1) 52%, rgba(18, 15, 13, 0.52) 100%),
        linear-gradient(180deg, rgba(18, 15, 13, 0.03), rgba(18, 15, 13, 0.26));
      pointer-events: none;
    }

    .reveal-text {
      position: relative;
      z-index: 1;
      width: min(760px, 100%);
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      text-shadow: 0 2px 22px rgba(0, 0, 0, 0.62);
    }

    .reveal.is-open .reveal-text {
      animation: revealWords 900ms ease 1s forwards;
    }

    .reveal-label {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 12px;
      border: 1px solid rgba(255, 250, 242, 0.34);
      border-radius: 999px;
      background: rgba(255, 250, 242, 0.12);
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: 0.86rem;
      backdrop-filter: blur(16px);
    }

    .reveal-title {
      margin: 18px 0 16px;
      font-size: clamp(2.2rem, 6vw, 5.6rem);
      line-height: 1;
    }

    .reveal-zh {
      margin: 0;
      font-size: clamp(1.25rem, 2.4vw, 2.2rem);
      font-weight: 700;
      line-height: 1.85;
    }

    .reveal-en {
      margin: 24px auto 0;
      max-width: 650px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 1.45vw, 1.28rem);
      font-style: italic;
      line-height: 1.8;
      opacity: 0.86;
    }

    .reveal-close {
      position: absolute;
      z-index: 2;
      right: 22px;
      bottom: 22px;
    }

    @keyframes breatheCard {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-18px) scale(1.035);
      }
    }

    @keyframes drawFocus {
      0% {
        transform: translateY(0) scale(1);
        filter: brightness(1);
      }
      34% {
        transform: translateY(-28px) scale(1.28) rotate(-1.5deg);
        filter: brightness(1.16);
      }
      58% {
        transform: translateY(-16px) scale(1.18) rotate(1deg);
        filter: brightness(1.18);
      }
      100% {
        transform: translateY(0) scale(1);
        filter: brightness(1);
      }
    }

    @keyframes drawGlow {
      0% {
        opacity: 0;
        transform: scale(0.72);
      }
      42% {
        opacity: 1;
        transform: scale(1.08);
      }
      100% {
        opacity: 0;
        transform: scale(1.42);
      }
    }

    @keyframes revealPhoto {
      0% {
        opacity: 0;
        transform: scale(1) translate3d(0, 0, 0);
      }
      16% {
        opacity: 1;
      }
      40% {
        opacity: 1;
        transform: scale(1) translate3d(0, 0, 0);
      }
      100% {
        opacity: 1;
        transform: scale(1.045) translate3d(0.55%, -0.45%, 0);
      }
    }

    @keyframes revealBackdrop {
      0% {
        opacity: 0;
        transform: scale(1.08);
      }
      18% {
        opacity: 0.72;
      }
      100% {
        opacity: 0.72;
        transform: scale(1.16);
      }
    }

    @keyframes revealWords {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 940px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }

      .stage {
        grid-template-columns: 1fr;
      }

      .deck {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .reading {
        position: static;
      }
    }

    @media (max-width: 720px) {
      .app {
        width: min(100% - 22px, 1180px);
        padding-top: 20px;
      }

      .intro {
        padding: max(14px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      }

      .intro-inner {
        width: min(420px, 100%);
        min-height: calc(100dvh - max(14px, env(safe-area-inset-top)) - max(24px, env(safe-area-inset-bottom)));
      }

      .breathing-card {
        width: min(30dvh, 230px, 62vw);
        min-width: 128px;
      }

      .deck {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
      }

      .card,
      .face {
        border-radius: 14px;
      }

      .note {
        left: 7px;
        right: 7px;
        bottom: 7px;
        padding: 9px;
        border-radius: 10px;
      }

      .reveal {
        padding: 18px;
      }

      .reveal-close {
        left: 18px;
        right: 18px;
        bottom: 18px;
        width: auto;
      }
    }

    @media (max-height: 640px) {
      .intro-inner {
        align-content: start;
        padding-top: max(18px, env(safe-area-inset-top));
        padding-bottom: max(42px, env(safe-area-inset-bottom));
      }

      .breathing-card {
        width: min(24dvh, 180px, 52vw);
        min-width: 112px;
      }

      .intro-kicker {
        line-height: 1.45;
      }

      .intro-kicker span {
        margin-top: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .action-button,
      .card-button,
      .breathing-card,
      .reveal-image,
      .reveal-text {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>
<body class="ritual-lock">
  <section class="intro" aria-label="回光療癒開場">
    <div class="intro-inner">
      <div class="breathing-card" aria-hidden="true"></div>
      <p class="intro-kicker">先停一下。<span>今天的你，需要哪一道光？</span></p>
      <button class="start-button" type="button" id="startButton">開始抽光</button>
    </div>
  </section>

  <main class="app">
    <section class="topbar" aria-label="遊戲標題">
      <div>
        <h1>回光療癒</h1>
        <p class="subtitle">從十張牌裡選一張，讓光把今天想送你的話翻出來。每張照片都藏著一段提醒，點開後會留在牌面成為註解。</p>
      </div>
      <div class="actions">
        <div class="pill" id="counter">已翻開 0 / 10</div>
        <button class="pill action-button" type="button" id="shuffleButton">重新洗牌</button>
        <button class="pill action-button" type="button" id="resetButton">全部蓋回</button>
      </div>
    </section>

    <section class="stage">
      <div class="deck" id="deck" aria-label="回光療癒牌組"></div>

      <aside class="reading" aria-live="polite">
        <span class="reading-label" id="readingLabel">等待抽牌</span>
        <h2 id="readingTitle">請任選一張牌</h2>
        <p class="zh" id="readingZh">當你翻開它，這裡會出現對應的療癒文字。</p>
        <p class="en" id="readingEn">Choose a card and let the message meet you where you are.</p>
        <p class="hint">小提醒：你可以一次翻開很多張，也可以按「全部蓋回」重新開始。</p>
      </aside>
    </section>
  </main>

  <section class="reveal" id="reveal" aria-live="polite" aria-hidden="true">
    <img class="reveal-backdrop" id="revealBackdrop" alt="">
    <img class="reveal-image" id="revealImage" alt="">
    <div class="reveal-text">
      <span class="reveal-label" id="revealLabel">第 1 張牌</span>
      <h2 class="reveal-title" id="revealTitle">彩虹</h2>
      <p class="reveal-zh" id="revealZh"></p>
      <p class="reveal-en" id="revealEn"></p>
    </div>
    <button class="reveal-close" type="button" id="revealClose">回到牌桌</button>
  </section>

  <script>
    const cards = [
      {
        number: 1,
        title: "彩虹",
        image: "1.JPG",
        zh: ["有些答案，不會馬上出現。", "但雨停了，光自然會進來。"],
        en: ["Some answers don’t appear right away.", "But when the rain stops, the light will come naturally."]
      },
      {
        number: 2,
        title: "黑框白牆",
        image: "2.JPG",
        zh: ["留白不是空，", "是讓情緒有地方安靜。"],
        en: ["Empty space is not emptiness.", "It’s a place where emotions can rest quietly."]
      },
      {
        number: 3,
        title: "陽光街景",
        image: "3.JPG",
        zh: ["光不是為了照亮世界，", "有時只是提醒你別低頭太久。"],
        en: ["Light isn’t always here to brighten the world.", "Sometimes, it’s just reminding you not to look down for too long."]
      },
      {
        number: 4,
        title: "樹葉散景",
        image: "4.JPG",
        zh: ["慢下來之後，", "連風吹過葉子的聲音都能療癒人。"],
        en: ["Once you slow down,", "even the sound of wind brushing through leaves can heal you."]
      },
      {
        number: 5,
        title: "山林纜道",
        image: "5.JPG",
        zh: ["人生很多路看起來陡，", "其實只是正在往更高的地方去。"],
        en: ["Many paths in life seem steep,", "but they may simply be leading you somewhere higher."]
      },
      {
        number: 6,
        title: "綁繩木頭",
        image: "6.JPG",
        zh: ["人生不是完美才穩，", "而是願意彼此拉著一起走。"],
        en: ["Life isn’t stable because it’s perfect,", "but because we’re willing to hold on and walk through it together."]
      },
      {
        number: 7,
        title: "影子",
        image: "7.JPG",
        zh: ["光越低的時候，", "越看得見自己真正的輪廓。"],
        en: ["When the light gets lower,", "you see your true outline more clearly."]
      },
      {
        number: 8,
        title: "廟宇飛簷",
        image: "8.jpg",
        zh: ["心靜下來之後，", "連天空都會變得很乾淨。"],
        en: ["Once the mind becomes still,", "even the sky begins to feel clearer."]
      },
      {
        number: 9,
        title: "神像",
        image: "9.JPG",
        zh: ["不是所有答案都要急著找，", "有時陪自己走一段就好。"],
        en: ["Not every answer needs to be found right away.", "Sometimes, just walking with yourself is enough."]
      },
      {
        number: 10,
        title: "老窗紅磚",
        image: "10.JPG",
        zh: ["有些舊痕跡沒有消失，", "只是變成了故事。"],
        en: ["Some old marks never disappear,", "they simply become stories."]
      }
    ];

    const deck = document.querySelector("#deck");
    const counter = document.querySelector("#counter");
    const readingLabel = document.querySelector("#readingLabel");
    const readingTitle = document.querySelector("#readingTitle");
    const readingZh = document.querySelector("#readingZh");
    const readingEn = document.querySelector("#readingEn");
    const startButton = document.querySelector("#startButton");
    const shuffleButton = document.querySelector("#shuffleButton");
    const resetButton = document.querySelector("#resetButton");
    const reveal = document.querySelector("#reveal");
    const revealBackdrop = document.querySelector("#revealBackdrop");
    const revealImage = document.querySelector("#revealImage");
    const revealLabel = document.querySelector("#revealLabel");
    const revealTitle = document.querySelector("#revealTitle");
    const revealZh = document.querySelector("#revealZh");
    const revealEn = document.querySelector("#revealEn");
    const revealClose = document.querySelector("#revealClose");

    let order = [...cards];
    let flipped = new Set();
    let audioContext;
    let masterGain;
    let ambientNodes = [];
    let soundOn = true;

    function shuffle(items) {
      const next = [...items];
      for (let index = next.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [next[index], next[swapIndex]] = [next[swapIndex], next[index]];
      }
      return next;
    }

    function updateCounter() {
      counter.textContent = `已翻開 ${flipped.size} / ${cards.length}`;
    }

    function updateReading(card) {
      readingLabel.textContent = `第 ${card.number} 張牌`;
      readingTitle.textContent = card.title;
      readingZh.innerHTML = card.zh.join("<br>");
      readingEn.innerHTML = card.en.join("<br>");
    }

    function ensureAudio() {
      if (audioContext) {
        return;
      }

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioContext.createGain();
      masterGain.gain.value = 0.14;
      masterGain.connect(audioContext.destination);

      [174.61, 220, 261.63, 329.63].forEach((frequency, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = index === 0 ? "triangle" : "sine";
        oscillator.frequency.value = frequency;
        gain.gain.value = 0.011 + index * 0.004;
        oscillator.connect(gain);
        gain.connect(masterGain);
        oscillator.start();
        ambientNodes.push({ oscillator, gain });
      });
    }

    function setSoundState(nextState) {
      soundOn = nextState;
      if (masterGain) {
        masterGain.gain.setTargetAtTime(soundOn ? 0.14 : 0, audioContext.currentTime, 0.5);
      }
    }

    function playChime() {
      if (!audioContext || !soundOn) {
        return;
      }

      const now = audioContext.currentTime;
      [392, 493.88, 587.33, 783.99].forEach((frequency, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = index === 0 ? "triangle" : "sine";
        oscillator.frequency.setValueAtTime(frequency, now + index * 0.08);
        oscillator.detune.setValueAtTime(index % 2 === 0 ? -4 : 3, now + index * 0.08);
        gain.gain.setValueAtTime(0, now + index * 0.08);
        gain.gain.linearRampToValueAtTime(0.058, now + index * 0.08 + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 1.75);
        oscillator.connect(gain);
        gain.connect(masterGain);
        oscillator.start(now + index * 0.08);
        oscillator.stop(now + index * 0.08 + 1.8);
      });
    }

    function openReveal(card) {
      revealBackdrop.src = card.image;
      revealImage.src = card.image;
      revealBackdrop.alt = "";
      revealImage.alt = card.title;
      revealLabel.textContent = `第 ${card.number} 張牌`;
      revealTitle.textContent = card.title;
      revealZh.innerHTML = card.zh.join("<br>");
      revealEn.innerHTML = card.en.join("<br>");
      reveal.classList.remove("is-open");
      revealBackdrop.style.animation = "none";
      revealImage.style.animation = "none";
      window.requestAnimationFrame(() => {
        revealBackdrop.style.animation = "";
        revealImage.style.animation = "";
        reveal.classList.add("is-open");
        reveal.setAttribute("aria-hidden", "false");
      });
    }

    function createCard(card) {
      const button = document.createElement("button");
      button.className = "card-button";
      button.type = "button";
      button.setAttribute("aria-label", `翻開第 ${card.number} 張牌：${card.title}`);
      button.dataset.number = card.number;
      button.innerHTML = `
          <span class="card">
          <span class="face back">
            <span class="light-symbol light-${card.number}" aria-hidden="true"></span>
          </span>
          <span class="face front">
            <img src="${card.image}" alt="${card.title}">
            <span class="note">
              <b>${card.title}</b>
              <span>${card.zh.join("<br>")}</span>
            </span>
          </span>
        </span>
      `;

      button.addEventListener("click", () => {
        if (button.classList.contains("is-flipped")) {
          updateReading(card);
          openReveal(card);
          return;
        }

        flipped.add(card.number);
        button.classList.add("is-drawing");
        playChime();
        window.setTimeout(() => {
          button.classList.add("is-flipped");
        }, 220);
        window.setTimeout(() => {
          openReveal(card);
        }, 780);
        window.setTimeout(() => {
          button.classList.remove("is-drawing");
        }, 780);
        button.setAttribute("aria-label", `已翻開第 ${card.number} 張牌：${card.title}`);
        updateCounter();
        updateReading(card);
      });

      return button;
    }

    function renderDeck() {
      deck.replaceChildren(...order.map(createCard));
      updateCounter();
    }

    resetButton.addEventListener("click", () => {
      flipped = new Set();
      reveal.classList.remove("is-open");
      reveal.setAttribute("aria-hidden", "true");
      document.querySelectorAll(".card-button").forEach((button) => {
        const card = cards.find((item) => String(item.number) === button.dataset.number);
        button.classList.remove("is-flipped", "is-drawing");
        button.setAttribute("aria-label", `翻開第 ${card.number} 張牌：${card.title}`);
      });
      updateCounter();
      readingLabel.textContent = "等待抽牌";
      readingTitle.textContent = "請任選一張牌";
      readingZh.textContent = "當你翻開它，這裡會出現對應的療癒文字。";
      readingEn.textContent = "Choose a card and let the message meet you where you are.";
    });

    shuffleButton.addEventListener("click", () => {
      flipped = new Set();
      reveal.classList.remove("is-open");
      reveal.setAttribute("aria-hidden", "true");
      order = shuffle(order);
      renderDeck();
      readingLabel.textContent = "已重新洗牌";
      readingTitle.textContent = "請再選一張牌";
      readingZh.textContent = "新的排列已經準備好，讓直覺先走一步。";
      readingEn.textContent = "The deck is ready again. Let intuition move first.";
    });

    startButton.addEventListener("click", () => {
      ensureAudio();
      setSoundState(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
      document.body.classList.add("is-started");
      document.body.classList.remove("ritual-lock");
      playChime();
    });

    revealClose.addEventListener("click", () => {
      reveal.classList.remove("is-open");
      reveal.setAttribute("aria-hidden", "true");
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        reveal.classList.remove("is-open");
        reveal.setAttribute("aria-hidden", "true");
      }
    });

    renderDeck();
  </script>
</body>
</html>
